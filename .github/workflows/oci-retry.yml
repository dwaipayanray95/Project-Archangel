name: OCI Instance Retry

# Scheduled retry loop for launching the Always-Free Ampere A1 instance.
# See README.md section 7. Each run is a single launch attempt; the
# 15-minute schedule provides the retry loop. Worst case (never succeeds,
# runs the full month) this stays well under the 2,000 min/month free-tier
# Actions budget for private repos - a 5-minute schedule would blow past it.
# Runs stop mattering once the instance exists - the script checks for one
# and exits early if found.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write   # needed to disable this workflow once the instance is up
  contents: read

jobs:
  retry-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          # No requirements.txt to key off, and the oci-cli version isn't
          # pinned - key on the runner image so the cache stays valid across
          # runs and just gets replaced if GitHub bumps the base image.
          key: pip-oci-cli-${{ runner.os }}-${{ runner.arch }}

      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Configure OCI CLI
        # Tenancy OCID and region aren't sensitive (they're already public in
        # infra/README.md and hardcoded in infra/scripts/oci_retry_once.sh as
        # COMPARTMENT_ID/AD), so they're hardcoded here rather than stored as
        # secrets. Only the actual credentials below come from secrets.
        env:
          OCI_TENANCY_OCID: "ocid1.tenancy.oc1..aaaaaaaabarxx7mbciow4ma43m4gl5q6pcbenxa3xynmq7eztbr3sgnfhfia"
          OCI_REGION: "ap-mumbai-1"
        run: |
          mkdir -p ~/.oci
          umask 077
          printf '%s' "${{ secrets.OCI_API_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=~/.oci/oci_api_key.pem
          pass_phrase=${{ secrets.OCI_API_KEY_PASSPHRASE }}
          EOF

      - name: Validate private key file
        # Two distinct failure modes, checked separately so the error names
        # the real problem instead of `oci` later misreading either one as
        # "needs an interactive passphrase prompt" and hanging:
        #   1. OCI_API_PRIVATE_KEY got pasted with mangled line breaks (e.g.
        #      flattened to one line) - not valid PEM at all.
        #   2. The key is passphrase-encrypted - needs OCI_API_KEY_PASSPHRASE
        #      to match, or the wrong/missing passphrase secret will still
        #      fail to decrypt it.
        # -passin pass:"$PASSPHRASE" makes openssl fail immediately instead
        # of prompting, whichever case this is - an empty passphrase secret
        # correctly fails against an actually-encrypted key.
        env:
          PASSPHRASE: ${{ secrets.OCI_API_KEY_PASSPHRASE }}
        run: |
          if ! openssl pkey -in ~/.oci/oci_api_key.pem -passin "pass:$PASSPHRASE" -noout -check 2>/tmp/key_check.err; then
            if grep -q "ENCRYPTED" ~/.oci/oci_api_key.pem; then
              echo "::error::Could not decrypt OCI_API_PRIVATE_KEY with the OCI_API_KEY_PASSPHRASE secret. Set/update that secret to the key's actual passphrase."
            else
              echo "::error::OCI_API_PRIVATE_KEY is not a valid private key. Re-copy the FULL contents of ~/.oci/oci_api_key.pem (including the -----BEGIN/-----END lines) into the secret, with the original line breaks intact - a common mistake is pasting it as one flattened line."
            fi
            cat /tmp/key_check.err
            exit 1
          fi
          echo "Private key file is valid PEM and decrypts with the supplied passphrase."

      - name: Write SSH public key
        run: printf '%s' "${{ secrets.OCI_SSH_PUBLIC_KEY }}" > /tmp/oci_ssh_key.pub

      - name: Verify OCI credentials
        # Fails fast with a clear "auth is broken" error if any of the 4
        # secrets is wrong/malformed, instead of letting that surface later
        # buried inside an instance-launch error. GitHub automatically masks
        # any secret value that appears in this step's output. Stdin is
        # redirected from /dev/null so a still-unexpected interactive prompt
        # fails immediately instead of hanging until the job times out.
        run: |
          if ! oci iam region list </dev/null > /tmp/oci_auth_check.json 2>/tmp/oci_auth_check.err; then
            echo "::error::OCI authentication failed - check OCI_USER_OCID and OCI_FINGERPRINT secrets for typos, and confirm the fingerprint matches the uploaded API key."
            cat /tmp/oci_auth_check.err
            exit 1
          fi
          echo "OCI credentials verified OK."

      - name: Attempt launch
        id: attempt
        env:
          SSH_KEY_PATH: /tmp/oci_ssh_key.pub
        run: |
          chmod +x infra/scripts/oci_retry_once.sh
          set +e
          ./infra/scripts/oci_retry_once.sh
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 0 = instance exists/created (success), 75 = out of capacity/rate
          # limited (expected, not a failure) - anything else is a real error.
          if [ "$code" -ne 0 ] && [ "$code" -ne 75 ]; then
            exit "$code"
          fi

      - name: Disable this workflow now that the instance exists
        if: steps.attempt.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            "/repos/${{ github.repository }}/actions/workflows/oci-retry.yml/disable"
          echo "Instance is up - workflow disabled so it stops scheduling itself."

name: Release backend

# Publishes archangeld-amd64/archangeld-arm64 as GitHub Release assets on
# every version tag push. This is what the in-app VPS setup wizard
# downloads from (a stable "latest release" URL) instead of the app
# needing to bundle server binaries itself - see
# app/frontend/lib/services/vps_setup_service.dart.
#
# Cut a release with:
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags:
      - "v*"

env:
  GO_VERSION: "1.24"

permissions:
  contents: write

jobs:
  release-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: app/backend/go.sum

      - run: go vet ./...
      - run: go test ./...
      - run: make build-linux-amd64
      - run: make build-linux-arm64

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            app/backend/bin/archangeld-amd64
            app/backend/bin/archangeld-arm64
          generate_release_notes: true
